name: Glen
description: >-
  Glen is a Y Combinator (Summer 2026) startup building a shared organizational
  learning and memory system for fleets of AI agents. The platform acts as a
  centralized store that every AI agent in a company can read from and write to,
  so that when one agent learns something the whole organization gains access to
  it. Glen preserves decisions, customer insights and operational procedures with
  full audit trails, applies role-based access control per observation at recall
  time, and connects to coding agents, PR assistants, bug bots and sales agents
  over the Model Context Protocol (MCP). It integrates with the tools where work
  already lives (code repositories, pull requests, issues, documentation and
  meetings) to give both agents and humans unified organizational context, aiming
  to eliminate knowledge silos, reduce new-hire ramp time and retain institutional
  knowledge through employee turnover. The company is pre-launch and operating a
  waitlist; its primary integration surface is an MCP server rather than a
  traditional REST API.
